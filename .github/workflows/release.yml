name: Release Builds

on:
  push:
    tags:
      - 'v*.*.*' # Matches tags like v1.0.0, v2.1.3, etc.

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest # Use a Linux runner for cross-compilation

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goarch: amd64
            goos: linux
          - os: linux
            arch: arm64
            goarch: arm64
            goos: linux
          - os: windows
            arch: amd64
            goarch: amd64
            goos: windows
            ext: .exe # Windows executables have .exe extension
          - os: darwin # macOS
            arch: amd64
            goarch: amd64
            goos: darwin
          - os: darwin # macOS
            arch: arm64
            goarch: arm64
            goos: darwin

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' # Or your preferred Go version

    - name: Get tag version
      id: get_version
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Build client
      run: |
        env GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o build/client-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./client/client.go
      working-directory: . # Ensure command runs from the root of the repository

    - name: Build server
      run: |
        env GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o build/server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./server/server.go
      working-directory: . # Ensure command runs from the root of the repository

    - name: Upload client artifact
      uses: actions/upload-artifact@v4
      with:
        name: client-${{ matrix.os }}-${{ matrix.arch }}
        path: build/client-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
        if-no-files-found: error # Fail if the file is not found

    - name: Upload server artifact
      uses: actions/upload-artifact@v4
      with:
        name: server-${{ matrix.os }}-${{ matrix.arch }}
        path: build/server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
        if-no-files-found: error # Fail if the file is not found

  create-release:
    name: Create GitHub Release
    needs: build # This job depends on all 'build' jobs completing successfully
    runs-on: ubuntu-latest
    if: success() # Only run if all previous jobs succeeded

    steps:
    - name: Get tag version
      id: get_version
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_VERSION }}
        name: Release ${{ env.RELEASE_VERSION }}
        draft: false # Set to true if you want to manually publish later
        prerelease: false # Set to true for pre-release versions
        generate_release_notes: true # Auto-generate release notes based on commit messages

  upload-release-assets:
    name: Upload Release Assets
    needs: [build, create-release] # Depends on builds and release creation
    runs-on: ubuntu-latest
    if: success() # Only run if all previous jobs succeeded

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./downloaded-artifacts # All artifacts will be downloaded here

    - name: Get tag version
      id: get_version
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Upload Client Assets to Release
      run: |
        # Loop through all downloaded client artifacts and upload them
        for f in downloaded-artifacts/client-*/client-*; do
          if [ -f "$f" ]; then
            echo "Uploading client asset: $f"
            gh release upload ${{ env.RELEASE_VERSION }} "$f" --repo ${{ github.repository }}
          fi
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Server Assets to Release
      run: |
        # Loop through all downloaded server artifacts and upload them
        for f in downloaded-artifacts/server-*/server-*; do
          if [ -f "$f" ]; then
            echo "Uploading server asset: $f"
            gh release upload ${{ env.RELEASE_VERSION }} "$f" --repo ${{ github.repository }}
          fi
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
